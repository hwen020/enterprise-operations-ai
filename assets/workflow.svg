<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 410" role="img" aria-label="Seven-step simulated workflow"><rect width="1190" height="410" rx="22" fill="#f5f7fb"/><text x="28" y="38" font-family="sans-serif" font-size="20" font-weight="bold" fill="#243444">Enterprise Operations AI / transparent workflow</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9b8bdc"/></marker></defs><rect x="25" y="70" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="43" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">1. PRODUCT IMPORT</text><text x="43" y="139" font-family="sans-serif" font-size="11" fill="#72808f">Synthetic CSV + SHA-256</text><rect x="315" y="70" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="333" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">2. VALIDATION</text><text x="333" y="139" font-family="sans-serif" font-size="11" fill="#72808f">Atomic / Decimal / conflicts</text><rect x="605" y="70" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="623" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">3. SEGMENT MATCH</text><text x="623" y="139" font-family="sans-serif" font-size="11" fill="#72808f">Dedupe + exclusion evidence</text><rect x="895" y="70" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="913" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">4. DRAFT GENERATION</text><text x="913" y="139" font-family="sans-serif" font-size="11" fill="#72808f">Local rule, not an LLM</text><rect x="895" y="260" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="913" y="298" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">5. HUMAN APPROVAL</text><text x="913" y="329" font-family="sans-serif" font-size="11" fill="#72808f">Current revision + hash</text><rect x="605" y="260" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="623" y="298" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">6. SIMULATION</text><text x="623" y="329" font-family="sans-serif" font-size="11" fill="#72808f">Idempotent / no real mail</text><rect x="315" y="260" width="265" height="105" rx="13" fill="white" stroke="#ded8f1"/><text x="333" y="298" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6858df">7. ANALYTICS</text><text x="333" y="329" font-family="sans-serif" font-size="11" fill="#72808f">Synthetic outcomes</text><path d="M290 120h20" fill="none" stroke="#9b8bdc" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 120h20" fill="none" stroke="#9b8bdc" stroke-width="2" marker-end="url(#arrow)"/><path d="M870 120h20" fill="none" stroke="#9b8bdc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025 180v70" fill="none" stroke="#9b8bdc" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 312h-20" fill="none" stroke="#9b8bdc" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 312h-20" fill="none" stroke="#9b8bdc" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="390" font-family="sans-serif" font-size="12" fill="#72808f">Simulation is explicit. Every record is fictional. No external messages or model calls.</text></svg>