services:
  - type: web
    name: enterprise-operations-ai
    runtime: python
    plan: free
    buildCommand: python -m pip install --no-index -r requirements.txt
    startCommand: python -B server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/enterprise-sandbox.sqlite3
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
